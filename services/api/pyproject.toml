[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialscan-api"
version = "0.1.0"
description = "SpatialScan API gateway - uploads, jobs, storage, worker triggers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "boto3>=1.34",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.21",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["spatialscan_api*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
