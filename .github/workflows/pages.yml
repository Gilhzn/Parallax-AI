name: Deploy web demo to GitHub Pages

on:
  push:
    branches: ["claude/spatialscan-platform-arch-agtxzq", "main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build (base path /Parallax-AI/)
        working-directory: apps/web
        env:
          BASE_PATH: /Parallax-AI/
          VITE_DEMO_MODE: "1"
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html   # SPA fallback for /tour/* and /jobs/*
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
