name: Probe live Pages site

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP checks
        run: |
          B=https://gilhzn.github.io/Parallax-AI
          echo "===== SPLAT WITH BROWSER ACCEPT-ENCODING (is it gzipped in transit?) ====="
          curl -s -o /dev/null -D - -H "Accept-Encoding: gzip, deflate, br, zstd" "$B/sample.splat" | grep -iE "HTTP|content-encoding|content-length|transfer-encoding|accept-ranges"
          echo "===== RANGE REQUEST WITH ACCEPT-ENCODING ====="
          curl -s -o /dev/null -D - -H "Accept-Encoding: gzip, deflate, br, zstd" -H "Range: bytes=0-65535" "$B/sample.splat" | grep -iE "HTTP|content-encoding|content-length|content-range"

      - name: Browser probe
        run: |
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright > /dev/null
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 800 } });
          page.on('console', m => console.log('[console]', m.type(), m.text().slice(0, 300)));
          page.on('pageerror', e => console.log('[pageerror]', e.message.slice(0, 500)));
          page.on('requestfailed', r => console.log('[reqfail]', r.url().slice(0, 150), r.failure()?.errorText));
          page.on('response', r => { if (r.status() >= 400) console.log('[http]', r.status(), r.url().slice(0, 150)); });

          console.log('===== ROOT PAGE =====');
          await page.goto('https://gilhzn.github.io/Parallax-AI/', { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForTimeout(4000);
          console.log('ROOT INNERHTML:', (await page.evaluate(() => document.getElementById('root')?.innerHTML?.slice(0, 500))) || 'EMPTY');
          await page.screenshot({ path: 'root.png' });

          for (const [label, url] of [
            ['TOUR PROGRESSIVE', 'https://gilhzn.github.io/Parallax-AI/tour/sample'],
            ['TOUR NOPROGRESSIVE', 'https://gilhzn.github.io/Parallax-AI/tour/sample?noprogressive=1'],
          ]) {
            console.log(`===== ${label} =====`);
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            for (let i = 1; i <= 6; i++) {
              await page.waitForTimeout(5000);
              const spinner = await page.locator('.spinner').count();
              const canvas = await page.locator('canvas').count();
              console.log(`t=${i * 5}s spinner=${spinner} canvas=${canvas}`);
              if (!spinner && canvas) { console.log(`${label}: SCENE LOADED OK`); break; }
            }
            await page.screenshot({ path: `${label.toLowerCase().replaceAll(' ', '-')}.png` });
          }
          await browser.close();
          EOF
          node probe.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-screenshots
          path: "*.png"
